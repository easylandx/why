<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El negocio que necesita una web.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0A5FC8;
    --blue-dark:#074A9E;
    --yellow:#FFD400;
    --red:#E8281E;
    --green:#2BBF5F;
    --pink:#EC4899;
    --ink:#141414;
    --white:#FFFFFF;
    --soft:#FFF4B8;
    --shadow:5px 5px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--yellow);overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.5;}
  h1,h2,h3,.display{font-family:'Poppins',sans-serif;font-weight:800;line-height:1.05;letter-spacing:-0.02em;}
  .wrap{max-width:1040px;margin:0 auto;padding-left:24px;padding-right:24px;}
  section{padding-top:84px;padding-bottom:84px;}
  .hl{color:var(--red);}
  .on-dark .hl{color:var(--yellow);}

  .reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease;}
  .reveal.in{opacity:1;transform:none;}

  /* NAV */
  nav{position:sticky;top:0;z-index:50;background:var(--white);border-bottom:3px solid var(--ink);}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;text-decoration:none;}
  .logo svg{width:38px;height:38px;}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .lang{display:inline-flex;border:2.5px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:3px 3px 0 var(--ink);background:var(--white);}
  .lang button{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:7px 10px;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);}
  .lang button svg{width:22px;height:15px;border-radius:2px;border:1px solid rgba(0,0,0,.25);}
  .lang button.active{background:var(--blue);color:var(--white);}
  .lang button:focus-visible{outline:3px solid var(--red);outline-offset:-3px;}
  .nav-cta{display:none;}

  /* BUTTONS */
  .btn{display:inline-block;font-family:'Inter',sans-serif;font-weight:700;font-size:16px;padding:14px 24px;border:2.5px solid var(--ink);border-radius:12px;text-decoration:none;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease;color:var(--ink);background:var(--white);}
  .btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink);}
  .btn:active{transform:none;box-shadow:2px 2px 0 var(--ink);}
  .btn-blue{background:var(--blue);color:var(--white);}
  .btn-red{background:var(--red);color:var(--white);}
  .btn-pink{background:var(--pink);color:var(--white);}
  .btn-green{background:var(--green);}
  .btn-yellow{background:var(--yellow);}
  .cta-row{display:flex;flex-wrap:wrap;gap:14px;}

  /* HERO */
  .hero{background:var(--yellow);text-align:center;padding-top:56px;padding-bottom:84px;}
  .hero-logo{width:104px;height:104px;margin:0 auto 26px;filter:drop-shadow(5px 5px 0 var(--ink));}
  .hero h1{font-size:clamp(38px,8vw,78px);margin-bottom:20px;}
  .hero p.lead{max-width:640px;margin:0 auto 30px;font-size:18px;}
  .hero .cta-row{justify-content:center;}
  .ticks{list-style:none;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:820px;margin:0 auto 34px;}
  .ticks li{background:var(--white);border:2px solid var(--ink);border-radius:30px;padding:7px 16px;font-weight:600;font-size:14.5px;}
  .ticks li::before{content:"✓ ";color:var(--green);font-weight:800;}

  /* SECTION HEAD */
  .head{max-width:680px;margin-bottom:44px;}
  .head.center{margin-left:auto;margin-right:auto;text-align:center;}
  .tag{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--yellow);padding:5px 12px;border-radius:6px;margin-bottom:14px;}
  .head h2{font-size:clamp(28px,5vw,46px);}

  /* BLOCK COLORS */
  .bg-blue{background:var(--blue);color:var(--white);}
  .bg-red{background:var(--red);color:var(--white);}
  .bg-pink{background:var(--pink);color:var(--white);}
  .bg-white{background:var(--white);}
  .bg-green{background:var(--green);}
  .bg-ink{background:var(--ink);color:var(--white);}
  .bg-yellow{background:var(--yellow);}
  .bg-blue .tag,.bg-red .tag,.bg-pink .tag{background:var(--yellow);color:var(--ink);}
  .bd{border-top:3px solid var(--ink);}

  /* CARDS */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
  .card{background:var(--white);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:22px;box-shadow:var(--shadow);}
  .card .role{font-weight:700;font-size:13px;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}

  /* QUIZ */
  .rx-pad{background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:34px;max-width:660px;margin:0 auto;}
  .rx-head{display:flex;align-items:center;gap:12px;border-bottom:2.5px dashed var(--ink);padding-bottom:14px;margin-bottom:10px;}
  .rx-head svg{width:40px;height:40px;}
  .rx-head .sub{font-size:13px;color:#555;}
  .rx-q{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;font-size:15px;border-bottom:1px solid #eee;}
  .rx-toggle{display:flex;gap:8px;flex-shrink:0;}
  .rx-toggle button{font-family:'Inter',sans-serif;font-weight:700;font-size:13px;border:2px solid var(--ink);background:var(--white);border-radius:8px;padding:7px 14px;cursor:pointer;}
  .rx-toggle button.yes{background:var(--green);}
  .rx-toggle button.no{background:var(--pink);color:var(--white);}
  .rx-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px;}
  .stamp{font-family:'Poppins',sans-serif;font-weight:800;font-size:14px;color:var(--red);border:3px solid var(--red);border-radius:8px;padding:8px 14px;text-transform:uppercase;transform:rotate(-6deg) scale(0);opacity:0;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s;}
  .stamp.show{transform:rotate(-6deg) scale(1);opacity:1;}

  /* NEEDS */
  .needs{display:grid;grid-template-columns:1fr 1fr;gap:0;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:8px 8px 0 var(--ink);}
  .needs > div{padding:32px 28px;}
  .needs h3{font-size:24px;margin-bottom:16px;}
  .needs ul{list-style:none;}
  .needs li{padding:9px 0;border-top:1px solid rgba(255,255,255,.3);font-weight:500;}
  .needs li:first-child{border-top:0;}
  .needs .a{background:var(--blue);color:var(--white);}
  .needs .b{background:var(--pink);color:var(--white);}
  .big-line{text-align:center;margin-top:36px;font-size:clamp(28px,5.5vw,52px);color:var(--red);}

  /* CHATS */
  .chats{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  .chat{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);border-radius:16px;padding:24px;}
  .chat h4{font-size:12px;letter-spacing:.12em;margin-bottom:14px;opacity:.85;}
  .bubble{max-width:85%;padding:10px 15px;border-radius:16px;margin-bottom:10px;font-size:15px;background:rgba(255,255,255,.2);border-bottom-left-radius:3px;}
  .bubble.me{background:var(--yellow);color:var(--ink);margin-left:auto;border-radius:16px;border-bottom-right-radius:3px;font-weight:600;}
  .bubble.me.win{background:var(--green);}
  .emoji{font-size:26px;text-align:right;}

  /* FORMULA */
  .eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin:10px 0 24px;}
  .eq-item{background:var(--white);border:2.5px solid var(--ink);border-radius:12px;padding:16px 22px;font-weight:700;box-shadow:4px 4px 0 var(--ink);}
  .eq-sym{font-family:'Poppins',sans-serif;font-weight:800;font-size:30px;}
  .eq-res{background:var(--blue);color:var(--white);border:3px solid var(--ink);border-radius:12px;padding:18px 26px;font-family:'Poppins',sans-serif;font-weight:800;font-size:clamp(18px,3vw,26px);box-shadow:var(--shadow);}

  /* STEPS */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .step .num{font-family:'Poppins',sans-serif;font-weight:800;font-size:46px;color:var(--red);line-height:1;}
  .step h4{font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;margin:8px 0 6px;}

  /* SEARCH */
  .search{max-width:520px;margin:0 auto 24px;background:var(--white);color:var(--ink);border:2.5px solid var(--ink);border-radius:40px;padding:15px 24px;text-align:left;font-size:16px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px;}
  .chip{padding:9px 16px;border-radius:30px;border:2px solid rgba(255,255,255,.55);font-weight:600;font-size:14px;}
  .chip.win{background:var(--yellow);color:var(--ink);border-color:var(--ink);}

  /* TESTIMONIALS */
  .stars{color:var(--red);letter-spacing:2px;margin-bottom:8px;}
  .who{font-weight:700;margin-top:12px;font-size:14px;}

  /* SIGNS */
  .signs{max-width:660px;margin:0 auto;}
  .sign{display:flex;gap:14px;padding:18px 0;border-top:2px dashed rgba(255,212,0,.45);font-size:17px;}
  .sign:last-child{border-bottom:2px dashed rgba(255,212,0,.45);}
  .sign span{color:var(--yellow);font-weight:800;}

  /* EMERGENCY */
  .siren{width:84px;height:84px;margin:0 auto 22px;border-radius:50%;background:var(--yellow);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:36px;animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .center-block{text-align:center;}

  /* FAQ */
  .faq-item{border-bottom:2.5px solid var(--ink);padding:18px 0;}
  .faq-item:first-child{border-top:2.5px solid var(--ink);}
  .faq-q{display:flex;justify-content:space-between;align-items:center;gap:16px;font-weight:700;font-size:17px;cursor:pointer;list-style:none;}
  .faq-q::-webkit-details-marker{display:none;}
  .faq-q::marker{content:"";}
  .faq-q:focus-visible{outline:3px solid var(--blue);outline-offset:5px;border-radius:3px;}
  .plus{font-family:'Poppins',sans-serif;font-size:26px;color:var(--red);transition:transform .2s;}
  .faq-item[open] .plus{transform:rotate(45deg);}
  .faq-a{padding-top:10px;color:#333;}

  /* FINAL */
  .final{text-align:center;padding-top:100px;padding-bottom:84px;}
  .final h2{font-size:clamp(36px,7vw,72px);margin-bottom:14px;}
  .final p{font-size:18px;margin-bottom:26px;}
  .final .cta-row{justify-content:center;}

  footer{background:var(--ink);color:rgba(255,255,255,.7);padding-top:32px;padding-bottom:32px;text-align:center;font-size:13.5px;}
  footer a{color:var(--yellow);text-decoration:none;font-weight:600;}

  @media (min-width:640px){.nav-cta{display:inline-block;padding:10px 18px;font-size:14px;box-shadow:3px 3px 0 var(--ink);}}
  @media (max-width:760px){
    section{padding-top:60px;padding-bottom:60px;}
    .needs,.chats,.steps{grid-template-columns:1fr;}
    .rx-pad{padding:24px 20px;}
    .logo span{font-size:19px;}
    .lang button{padding:6px 8px;}
  }
  @media (prefers-reduced-motion:reduce){
    .reveal{transition:none;}.siren{animation:none;}.plus{transition:none;}
  }
</style>
</head>
<body>

<!-- SVG sprites -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="logo" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#0A5FC8"/>
      <circle cx="62" cy="42" r="31" fill="#FFD400"/>
      <polygon points="19.5,47.5 80,22.5 41,58" fill="#FFFFFF"/>
      <polygon points="80,22.5 48,80.5 41,58" fill="#E8281E"/>
      <polygon points="41,58 48,80.5 40,64" fill="#2BBF5F"/>
      <circle cx="22" cy="78" r="2.6" fill="#FFFFFF"/>
      <circle cx="32" cy="73" r="2.2" fill="#FFFFFF"/>
      <circle cx="39.5" cy="68.5" r="1.7" fill="#FFFFFF"/>

    <symbol id="flag-es" viewBox="0 0 24 16">

      <path d="M0 0L60 40M60 0L0 40" stroke="#FFFFFF" stroke-width="8"/>
      <path d="M0 0L60 40M60 0L0 40" stroke="#C8102E" stroke-width="3"/>
      <path d="M30 0V40M0 20H60" stroke="#FFFFFF" stroke-width="12"/>
      <path d="M30 0V40M0 20H60" stroke="#C8102E" stroke-width="7"/>

</svg>

<nav>
  <div class="wrap">
    <a class="logo" href="#top" aria-label="EasyLandX"><svg><use href="#logo"/></svg><span>EasyLandX</span></a>
    <div class="nav-right">
      <div class="lang" role="group" aria-label="Language / Idioma">
        <button type="button" data-lang="es" aria-label="Español"><svg viewBox="0 0 24 16"><use href="#flag-es"/></svg>ES</button>
        <button type="button" data-lang="en" aria-label="English"><svg viewBox="0 0 60 40" preserveAspectRatio="none"><use href="#flag-en"/></svg>EN</button>
      </div>
      <a href="https://easylandx.github.io/" class="btn btn-red nav-cta" data-i18n="nav_cta"></a>
    </div>
  </div>
</nav>

<!-- HERO -->
<header class="hero" id="top">
  <div class="wrap">
    <svg class="hero-logo reveal in" role="img" aria-label="EasyLandX"><use href="#logo"/></svg>
    <h1 class="reveal in"><span data-i18n="h1_a"></span> <span class="hl" data-i18n="h1_b"></span></h1>
    <ul class="ticks reveal in">
      <li data-i18n="t1"></li><li data-i18n="t2"></li><li data-i18n="t3"></li><li data-i18n="t4"></li><li data-i18n="t5"></li><li data-i18n="t6"></li>
    </ul>
    <p class="lead reveal in" data-i18n="lead"></p>
    <div class="cta-row reveal in">
      <a href="#test" class="btn btn-blue" data-i18n="cta_yes"></a>
      <a href="#sample" class="btn" data-i18n="cta_see"></a>
    </div>
  </div>
</header>

<!-- SYMPTOMS -->
<section class="bg-blue on-dark bd">
  <div class="wrap">
    <div class="head reveal"><span class="tag" data-i18n="sym_tag"></span><h2><span data-i18n="sym_h_a"></span> <span class="hl" data-i18n="sym_h_b"></span></h2></div>
    <div class="grid">
      <div class="card reveal" data-i18n="s1"></div><div class="card reveal" data-i18n="s2"></div>
      <div class="card reveal" data-i18n="s3"></div><div class="card reveal" data-i18n="s4"></div>
      <div class="card reveal" data-i18n="s5"></div><div class="card reveal" data-i18n="s6"></div>
      <div class="card reveal" data-i18n="s7"></div><div class="card reveal" data-i18n="s8"></div>
    </div>
  </div>
</section>

<!-- QUIZ -->
<section class="bg-yellow bd" id="test">
  <div class="wrap">
    <div class="head center reveal"><span class="tag" data-i18n="q_tag"></span><h2 data-i18n="q_h"></h2></div>
    <div class="rx-pad reveal">
      <div class="rx-head">
        <svg><use href="#logo"/></svg>
        <div><strong style="font-family:'Poppins',sans-serif;font-size:20px;">EasyLandX</strong><div class="sub" data-i18n="q_sub"></div></div>
      </div>
      <div class="rx-q"><span data-i18n="q1"></span><div class="rx-toggle" data-q="1"><button data-val="yes" data-i18n="yes"></button><button data-val="no" data-i18n="no"></button></div></div>
      <div class="rx-q"><span data-i18n="q2"></span><div class="rx-toggle" data-q="2"><button data-val="yes" data-i18n="yes"></button><button data-val="no" data-i18n="no"></button></div></div>
      <div class="rx-q"><span data-i18n="q3"></span><div class="rx-toggle" data-q="3"><button data-val="yes" data-i18n="yes"></button><button data-val="no" data-i18n="no"></button></div></div>
      <div class="rx-q"><span data-i18n="q4"></span><div class="rx-toggle" data-q="4"><button data-val="yes" data-i18n="yes"></button><button data-val="no" data-i18n="no"></button></div></div>
      <div class="rx-foot">
        <button class="btn btn-blue" id="diagnoseBtn" data-i18n="q_btn"></button>
        <div class="stamp" id="stamp" role="status"></div>
      </div>
    </div>
  </div>
</section>

<!-- NEEDS -->
<section class="bg-white bd">
  <div class="wrap">
    <div class="head reveal"><span class="tag" data-i18n="n_tag"></span><h2 data-i18n="n_h"></h2></div>
    <div class="needs reveal">
      <div class="a">
        <h3 data-i18n="n_a_h"></h3>
        <ul><li data-i18n="n_a1"></li><li data-i18n="n_a2"></li><li data-i18n="n_a3"></li><li data-i18n="n_a4"></li><li data-i18n="n_a5"></li></ul>
      </div>
      <div class="b">
        <h3 data-i18n="n_b_h"></h3>
        <ul><li data-i18n="n_b1"></li><li data-i18n="n_b2"></li><li data-i18n="n_b3"></li><li data-i18n="n_b4"></li><li data-i18n="n_b5"></li><li data-i18n="n_b6"></li><li data-i18n="n_b7"></li></ul>
      </div>
    </div>
    <p class="display big-line reveal" data-i18n="n_big"></p>
  </div>
</section>

<!-- BEFORE / AFTER -->
<section class="bg-red on-dark bd" id="sample">
  <div class="wrap">
    <div class="head reveal"><span class="tag" data-i18n="ba_tag"></span><h2 data-i18n="ba_h"></h2></div>
    <div class="chats">
      <div class="chat reveal"><h4 data-i18n="ba_before"></h4>
        <div class="bubble" data-i18n="c1"></div><div class="bubble me" data-i18n="c2"></div><div class="bubble" data-i18n="c3"></div><div class="emoji">😬</div></div>
      <div class="chat reveal"><h4 data-i18n="ba_after"></h4>
        <div class="bubble" data-i18n="c1"></div><div class="bubble me win" data-i18n="c4"></div><div class="bubble" data-i18n="c5"></div><div class="emoji">😎</div></div>
    </div>
  </div>
</section>

<!-- FORMULA -->
<section class="bg-yellow bd">
  <div class="wrap">
    <div class="head center reveal"><span class="tag" data-i18n="f_tag"></span><h2 data-i18n="f_h"></h2></div>
    <div class="eq reveal">
      <div class="eq-item" data-i18n="f1"></div><span class="eq-sym">+</span>
      <div class="eq-item" data-i18n="f2"></div><span class="eq-sym">+</span>
      <div class="eq-item" data-i18n="f3"></div><span class="eq-sym">+</span>
      <div class="eq-item" data-i18n="f4"></div><span class="eq-sym">=</span>
      <div class="eq-res" data-i18n="f_res"></div>
    </div>
    <p class="reveal" style="text-align:center;font-weight:500;" data-i18n="f_note"></p>
  </div>
</section>

<!-- PROFILES -->
<section class="bg-ink on-dark bd">
  <div class="wrap">
    <div class="head reveal"><span class="tag" data-i18n="p_tag"></span><h2 data-i18n="p_h"></h2></div>
    <div class="grid">
      <div class="card reveal"><div class="role" data-i18n="pr1"></div><div data-i18n="pq1"></div></div>
      <div class="card reveal"><div class="role" data-i18n="pr2"></div><div data-i18n="pq2"></div></div>
      <div class="card reveal"><div class="role" data-i18n="pr3"></div><div data-i18n="pq3"></div></div>
      <div class="card reveal"><div class="role" data-i18n="pr4"></div><div data-i18n="pq4"></div></div>
      <div class="card reveal"><div class="role" data-i18n="pr5"></div><div data-i18n="pq5"></div></div>
      <div class="card reveal"><div class="role" data-i18n="pr6"></div><div data-i18n="pq6"></div></div>
    </div>
  </div>
</section>

<!-- PROCESS -->
<section class="bg-white bd">
  <div class="wrap">
    <div class="head reveal"><span class="tag" data-i18n="pc_tag"></span><h2 data-i18n="pc_h"></h2></div>
    <div class="steps">

function setWaLink(){

function applyLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.title = T[l].page_title;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ const v = T[l][el.dataset.i18n]; if(v!==undefined) el.textContent = v; });
  document.querySelectorAll('.lang button').forEach(b=>{
    const on = b.dataset.lang===l; b.classList.toggle('active',on); b.setAttribute('aria-pressed', on);
  });
  const st = document.getElementById('stamp');
  if(st.dataset.state) st.textContent = T[l][st.dataset.state];
  setWaLink();
  try{ localStorage.setItem('elx-lang', l); }catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>applyLang(b.dataset.lang)));
