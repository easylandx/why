<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cota Viva</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pine:#1d3b2a;--sky:#bde4fa;--org:#ffc79b;--lime:#dceb8e;--sand:#f5e7c8;--ras:#f9cfda;--red:#d8344a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:120px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#fff;color:var(--pine);font:400 1.0625rem/1.6 'Instrument Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Arial Narrow',sans-serif;font-weight:800;line-height:1.05;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.6rem,7vw,5rem)}h2{font-size:clamp(2rem,4.5vw,3.2rem)}h3{font-size:1.4rem}
p{margin:0 0 1em;max-width:62ch}
img{display:block;width:100%;height:auto}
:focus-visible{outline:3px solid var(--pine);outline-offset:3px}
.wrap{width:min(1080px,100% - 2*clamp(24px,7vw,96px));margin-inline:auto;position:relative}
nav{position:sticky;top:0;z-index:20;background:#fffdf6;border-bottom:3px solid var(--pine);padding:8px clamp(16px,4vw,40px) 6px;padding-top:calc(8px + env(safe-area-inset-top,0px));margin-top:calc(-1*env(safe-area-inset-top,0px))}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font:800 1.25rem 'Bricolage Grotesque',sans-serif}
#cur{font-weight:600;font-size:.9rem;flex:1;text-align:center}
.lang button{font:600 .85rem inherit;border:2px solid var(--pine);background:#fff;color:var(--pine);padding:3px 10px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--pine);color:#fff}
.prof{position:relative;height:58px;margin:4px 6px 0}
.prof svg{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid var(--pine);background:#fff;padding:0;cursor:pointer}
.stop.on{background:var(--red)}
#hk{position:absolute;width:18px;height:28px;margin-left:-9px;pointer-events:none}
.mark{display:inline-block;width:14px;height:28px;border:2px solid var(--pine);background:linear-gradient(#fff 50%,var(--red) 50%);vertical-align:-3px;margin-right:12px}
section{padding:clamp(64px,10vw,120px) 0;position:relative;overflow:hidden}
section>.wrap{z-index:1}
.sky{background:var(--sky)}.org{background:var(--org)}.lime{background:var(--lime)}.sand{background:var(--sand)}.ras{background:var(--ras)}
.topo::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(ellipse 60% 40% at 85% 15%,transparent 0 26px,rgba(255,255,255,.55) 26px 29px)}
.btn{display:inline-block;font:600 1rem inherit;background:var(--pine);color:#fff;border:2px solid var(--pine);padding:14px 24px;border-radius:999px;text-decoration:none;cursor:pointer;margin:0 10px 10px 0}
.btn.alt{background:#fff;color:var(--pine)}
.hero{display:grid;gap:40px;align-items:center}
@media(min-width:860px){.hero{grid-template-columns:1.05fr 1fr}.two{grid-template-columns:1fr 1fr!important}}
.hero img,.ph{border-radius:28px 28px 110px 28px;border:3px solid var(--pine)}
.small{font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}
.chip{font:600 1rem inherit;color:var(--pine);background:#fff;border:3px solid var(--pine);border-radius:999px;padding:12px 22px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pine);color:#fff}
.res{background:#fff;border:3px solid var(--pine);padding:20px 24px;max-width:560px;min-height:7.5em}
.cards{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:#fff;border:3px solid var(--pine);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.card.on{box-shadow:0 0 0 6px var(--red)}
.card img{aspect-ratio:4/3;object-fit:cover}
.card div{padding:18px 20px 8px}
.meta{font-size:.9rem;border-top:2px dashed var(--pine);padding:10px 20px 14px;margin-top:auto}
form{display:grid;gap:16px;max-width:560px}
label{display:grid;gap:4px;font-weight:600}
input,select{font:400 1rem inherit;padding:12px;border:3px solid var(--pine);background:#fff;color:var(--pine);border-radius:12px;width:100%}
.two{display:grid;gap:40px;align-items:center}
ul.ck{list-style:none;padding:0;margin:0 0 1em}
ul.ck label{display:flex;gap:12px;align-items:center;font-weight:400;padding:8px 0;border-bottom:2px dashed rgba(29,59,42,.35)}
ul.ck input{width:22px;height:22px;accent-color:var(--pine)}
ul.ck input:checked+span{text-decoration:line-through;opacity:.6}
.warn{background:#fff;border:3px solid var(--red);padding:16px 20px;margin-bottom:28px;max-width:720px}
details{background:#fff;border:3px solid var(--pine);border-radius:16px;padding:14px 20px;margin-bottom:12px;max-width:720px}
summary{font-weight:600;cursor:pointer}
details p{margin:10px 0 0}
footer{background:var(--pine);color:#fff;text-align:center;padding:28px 24px 36px}
footer p{margin:0 auto 4px}
</style></head><body>
