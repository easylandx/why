<style>
:root{--cream:#FFF9E8;--tom:#E8503A;--leaf:#3E8E5A;--lem:#F6D743;--mel:#FF8A8F;--ink:#2B3A2E}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:17px/1.6 "DM Sans",system-ui,sans-serif;color:var(--ink);background-color:var(--cream);background-image:linear-gradient(rgba(232,80,58,.07) 50%,transparent 50%),linear-gradient(90deg,rgba(232,80,58,.07) 50%,transparent 50%);background-size:36px 36px;overflow-x:hidden}
h1,h2,h3,.bf{font-family:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;font-weight:800;line-height:1.05;margin:0}
h1{font-size:clamp(2.8rem,7vw,4.8rem);color:var(--tom)}
h2{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:8px}
h3{font-size:1.25rem;font-weight:800}
p{margin:0 0 12px}
a{color:#B8321E}
header{display:flex;justify-content:space-between;align-items:center;max-width:1280px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) clamp(16px,4vw,48px) 8px}
.brand{font:800 1.4rem "Bricolage Grotesque",sans-serif}
.lang{font:700 .9rem "DM Sans",sans-serif;color:var(--ink);text-decoration:none;border:2.5px solid var(--ink);border-radius:999px;padding:2px 14px;background:var(--lem)}
.app{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:28px;max-width:1280px;margin:0 auto;padding:10px clamp(16px,4vw,48px) 40px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
@media(max-width:900px){.panel{position:static;max-height:none}}
.box{background:#fffdf4;border:3px solid var(--ink);border-radius:20px;padding:clamp(18px,3vw,28px)}
.panel .box{box-shadow:6px 6px 0 var(--tom)}
main section{margin-bottom:28px}
main section.box{box-shadow:6px 6px 0 var(--lem)}
.grid{display:grid;grid-template-columns:auto repeat(7,1fr);gap:5px;margin:12px 0;align-items:center}
.grid b{font:800 .85rem "Bricolage Grotesque",sans-serif;text-align:center}
.grid .ml{font-size:.75rem;font-weight:700;padding-right:4px}
.cell{aspect-ratio:1;min-width:0;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font:800 1rem "Bricolage Grotesque",sans-serif;color:var(--ink);cursor:pointer;padding:0}
.cell.f{background:var(--lem)}
.cell[aria-pressed=true]{outline:3px solid var(--tom);outline-offset:1px}
.pick{border-top:2px dashed var(--ink);padding-top:10px;margin-top:6px}
.pick button.d{display:block;width:100%;text-align:left;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:7px 12px;margin:6px 0;font:600 .95rem "DM Sans",sans-serif;color:var(--ink);cursor:pointer}
.pick button.d[aria-pressed=true]{background:var(--lem)}
.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:5px;border:1.5px solid var(--ink)}
.bar{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:.9rem;font-weight:600}
.bar i{display:block;height:14px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}.bar i s{display:block;height:100%;background:var(--c);transition:width .3s}
.bar span{font-size:.8rem;min-width:62px;text-align:right}
.small{font-size:.85rem}
.note{background:#FFE7E8;border:2px dashed var(--tom);border-radius:14px;padding:10px 14px;font-size:.9rem;margin-top:12px}
.btn{display:inline-block;background:var(--tom);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:10px 22px;font:800 1rem "Bricolage Grotesque",sans-serif;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink);margin:8px 8px 4px 0}
.btn.l{background:var(--leaf)}.btn.y{background:var(--lem);color:var(--ink)}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
:focus-visible{outline:3px solid var(--tom);outline-offset:2px}
.hero{display:grid;grid-template-columns:1fr;gap:16px}
.hp{position:relative}.hp img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:78% 40%;border:3px solid var(--ink);border-radius:20px;display:block}
.stk{position:absolute;left:-8px;top:-14px;width:104px;height:104px;border-radius:50%;background:var(--lem);border:3px solid var(--ink);display:grid;place-items:center;text-align:center;font:800 1rem/1.1 "Bricolage Grotesque",sans-serif;transform:rotate(-12deg);padding:8px}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
@media(max-width:620px){.st{grid-template-columns:1fr}}
.st div{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.st .n{grid-row:span 2;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font:800 1.3rem "Bricolage Grotesque",sans-serif}
.st p{margin:0;font-size:.95rem}
.tags{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:14px 0}
@media(max-width:620px){.tags{grid-template-columns:1fr}}
.tag{position:relative;border:3px solid var(--ink);border-radius:8px 18px 18px 8px;padding:14px 16px 12px 36px;background:#fff}
.tag::before{content:"";position:absolute;left:11px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;border:3px solid var(--ink);background:var(--cream)}
.tag b{display:inline-block;margin-top:6px;background:var(--lem);border:2px solid var(--ink);border-radius:8px;padding:0 10px;font:800 1.1rem "Bricolage Grotesque",sans-serif}
.two{display:grid;grid-template-columns:.8fr 1.2fr;gap:22px;align-items:start}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.ph{width:100%;display:block;border:3px solid var(--ink);border-radius:18px;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips span{border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:.9rem;background:#E6F3EA;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.gal figure{margin:0}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border:3px solid var(--ink);border-radius:16px;display:block}
.gal figcaption{font:800 .95rem "Bricolage Grotesque",sans-serif;padding-top:4px}
.ids{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}
@media(max-width:700px){.ids{grid-template-columns:1fr}}
.id{border:3px solid var(--ink);border-radius:18px;padding:14px 16px;background:#fff}
.id:nth-child(2){background:#E6F3EA}.id:nth-child(3){background:#FFE7E8}
.id ul{margin:8px 0;padding-left:18px}.id li{font-size:.95rem}
.id label{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}.id input{width:20px;height:20px;accent-color:var(--tom)}
.q{border-top:2.5px solid var(--ink)}
.q button{width:100%;text-align:left;background:transparent;border:0;padding:12px 30px 12px 0;font:800 1.1rem "Bricolage Grotesque",sans-serif;color:var(--ink);cursor:pointer;position:relative}
.q button::after{content:"+";position:absolute;right:4px;top:8px;font-size:1.5rem;color:var(--tom)}
.q button[aria-expanded=true]::after{content:"–"}
.q p[hidden]{display:none}
.foot{margin-top:18px;padding-top:12px;border-top:2px dashed var(--ink);font-weight:700}
</style>
</head>

const eur=n=>D.cur==='after'?n+' €':'€'+n;
$$('[data-k]').forEach(e=>e.innerHTML=T[e.dataset.k]||'');
$$('[data-img]').forEach(i=>{i.src=IM[i.dataset.img];i.alt=D.alt[i.dataset.img]||'';});
$('#wa').href='https://wa.me/34600000000?text='+encodeURIComponent(T.wagen);
// semana
const sel=Array(21).fill(-1);let cur=-1;
const gc=Object.fromEntries(D.groups.map(g=>[g[0],g]));
const idx=(d,m)=>d*3+m;
function grid(){let h='<span></span>'+D.days.map(d=>`<b>${d}</b>`).join('');
 D.meals.forEach((m,mi)=>{h+=`<span class="ml">${m.slice(0,3)}</span>`;D.days.forEach((_,di)=>{const k=idx(di,mi),s=sel[k];
  h+=`<button class="cell${s>=0?' f':''}" data-k2="${k}" aria-pressed="${k==cur}" aria-label="${D.daysf[di]} · ${m}: ${s>=0?D.dishes[mi][s][0]:'—'}">${s>=0?D.dishes[mi][s][0][0]:'+'}</button>`})});
 $('#grid').innerHTML=h;$$('.cell').forEach(b=>b.onclick=()=>{cur=+b.dataset.k2;draw()})}
function pick(){if(cur<0){$('#pick').innerHTML='<p class="small" style="margin:0">'+T.pick+'</p>';return}
 const di=Math.floor(cur/3),mi=cur%3;
 $('#pick').innerHTML=`<h3>${D.daysf[di][0].toUpperCase()+D.daysf[di].slice(1)} · ${D.meals[mi]}</h3>`+D.dishes[mi].map((d,i)=>`<button class="d" data-i="${i}" aria-pressed="${sel[cur]==i}">${d[0]}${[...d[1]].map(c=>`<span class="dt" style="background:${gc[c][3]}"></span>`).join('')}</button>`).join('')+`<button class="btn y" id="rm" style="font-size:.9rem;padding:6px 16px">${T.none}</button>`;
 $$('.pick .d').forEach(b=>b.onclick=()=>{sel[cur]=+b.dataset.i;draw()});$('#rm').onclick=()=>{sel[cur]=-1;draw()}}
function bal(){const c={};D.groups.forEach(g=>c[g[0]]=0);let n=0;
 sel.forEach((s,k)=>{if(s>=0){n++;[...D.dishes[k%3][s][1]].forEach(x=>c[x]++)}});
 $('#bal').innerHTML=D.groups.map(g=>{const v=c[g[0]],p=Math.min(100,v/g[2]*100);return `<div class="bar" style="--c:${g[3]}"><label>${g[1]}</label><i><s style="width:${p}%"></s></i><span>${v}/${g[2]} · ${v>=g[2]?T.ok:T.miss.replace('{n}',g[2]-v)}</span></div>`}).join('');
 const lines=[];D.daysf.forEach((d,di)=>{const p=D.meals.map((m,mi)=>sel[idx(di,mi)]>=0?m+': '+D.dishes[mi][sel[idx(di,mi)]][0]:'').filter(Boolean);if(p.length)lines.push(d+' → '+p.join('; '))});
 const w=$('#wpl');if(!n){w.removeAttribute('href');w.setAttribute('aria-disabled','true')}else{w.removeAttribute('aria-disabled');w.href='https://wa.me/34600000000?text='+encodeURIComponent(T.wapl+'\n'+lines.join('\n'))}}
function draw(){grid();pick();bal()}draw();
// estáticos
$('#st').innerHTML=D.stages.map((s,i)=>`<div><span class="n" style="background:${['#F6D743','#FF8A8F','#CFE8D6','#fff'][i]}">${i+1}</span><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');
$('#cs').innerHTML=D.consults.map(c=>`<div class="tag"><h3>${c[0]}</h3><span class="small">${c[1]}</span><br><b>${c[2]}</b></div>`).join('');
$('#ar').innerHTML=D.areas.map(a=>`<span>${a}</span>`).join('');
$('#gal').innerHTML=['cocina','consulta','mercado','plato'].map((k,i)=>`<figure><img src="${IM[k]}" alt="${D.alt[k]}"><figcaption>${D.gal[i]}</figcaption></figure>`).join('');
// ideas
$('#ids').innerHTML=D.ideas.map((x,i)=>`<div class="id"><h3>${x[0]}</h3><ul>${x[1].map(l=>`<li>${l}</li>`).join('')}</ul><label><input type="checkbox" data-i="${i}">${T.like}</label></div>`).join('');
function ids(){const l=$$('#ids input:checked').map(i=>D.ideas[+i.dataset.i]),w=$('#wid');
 if(!l.length){w.removeAttribute('href');w.setAttribute('aria-disabled','true');return}
 w.removeAttribute('aria-disabled');w.href='https://wa.me/34600000000?text='+encodeURIComponent(T.waid.replace('{s}',l.map(x=>x[0]+' ('+x[1].join(', ')+')').join(' · ')))}
$('#ids').addEventListener('change',ids);ids();
// preguntas
$('#faq').innerHTML=D.faq.map((f,i)=>`<div class="q"><button aria-expanded="false" aria-controls="q${i}">${f[0]}</button><p id="q${i}" hidden>${f[1]}</p></div>`).join('');
$$('#faq button').forEach(b=>b.onclick=()=>{const a=document.getElementById(b.getAttribute('aria-controls')),o=a.hidden;a.hidden=!o;b.setAttribute('aria-expanded',o)});
</script>
