<style>
:root{--ivory:#FFFAF0;--champ:#F3E3C3;--gold:#D4A33C;--sky:#8EC5E8;--peach:#F7B58E;--ink:#2E3A4F}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:17px/1.65 Manrope,system-ui,sans-serif;color:var(--ink);background:var(--ivory);overflow-x:hidden}
h1,h2,h3,.sf{font-family:"Playfair Display",Georgia,serif;font-weight:500;line-height:1.1;margin:0}
h1{font-size:clamp(3rem,9vw,6rem)}
h2{font-size:clamp(1.9rem,4.6vw,3rem);margin-bottom:8px}
h3{font-size:1.4rem}
p{margin:0 0 12px}
a{color:#9A6B12}
section{padding:clamp(44px,8vh,84px) clamp(20px,6vw,72px)}
.wrap{max-width:1080px;margin:0 auto}
.rule{border:0;border-top:1px solid var(--gold);margin:0 0 22px}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) clamp(20px,6vw,72px) 14px;max-width:1224px;margin:0 auto}
.brand{font:600 1.35rem "Playfair Display",Georgia,serif}
.lang{font:800 .85rem Manrope,sans-serif;color:var(--ink);text-decoration:none;border:1px solid var(--gold);border-radius:999px;padding:3px 14px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,60px);align-items:center}
@media(max-width:820px){.hero,.two,.wheel{grid-template-columns:1fr!important}}
.tag{display:inline-block;font:700 .9rem Manrope,sans-serif;border-bottom:1px solid var(--gold);padding-bottom:2px;margin-bottom:14px}
.lead{font-size:1.2rem;max-width:30em}
.ph{width:100%;display:block;border-radius:4px;box-shadow:12px 12px 0 var(--champ)}
.hero .ph{aspect-ratio:4/5;object-fit:cover;object-position:78% 30%}
.wheel{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(20px,4vw,44px);align-items:center;background:#fff;border:1px solid var(--gold);padding:clamp(20px,4vw,40px);box-shadow:10px 10px 0 var(--champ)}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:12px 0}
.sl label{font-weight:800}.sl output{font:italic 600 1.3rem "Playfair Display",serif;color:#9A6B12}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--gold)}
.sl input{-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;background:var(--champ);outline-offset:6px}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--ink)}
.sl input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--gold);border:2px solid var(--ink)}
.sl input::-moz-range-track{background:var(--champ);height:8px;border-radius:99px}
svg{width:100%;height:auto;display:block}
.res{background:var(--ivory);border:1px dashed var(--gold);padding:14px 18px;margin-top:10px}
.res b{font-weight:800}
.btn{display:inline-block;background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:11px 26px;font:800 1rem Manrope,sans-serif;cursor:pointer;text-decoration:none;margin:8px 10px 6px 0}
.btn.o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid #9A6B12;outline-offset:2px}
.note{background:var(--champ);padding:12px 18px;font-size:.95rem;margin-top:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--gold);margin-top:18px}
@media(max-width:700px){.steps{grid-template-columns:repeat(2,1fr)}}
.steps button{border:0;border-right:1px solid rgba(212,163,60,.4);background:transparent;padding:16px 12px;text-align:left;cursor:pointer;color:var(--ink);font:700 1rem Manrope,sans-serif}
.steps button .n{display:block;font:italic 500 3rem/1 "Playfair Display",serif;color:var(--gold)}
.steps button[aria-pressed=true]{background:var(--champ)}
#sd{padding:18px 22px;background:#fff;border:1px solid var(--gold);margin-top:-1px}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:18px 0}
@media(max-width:640px){.pg{grid-template-columns:1fr}}
.pg div{border-top:1px solid var(--gold);padding:14px 0 6px}
.pg b{display:block;font:italic 600 1.2rem "Playfair Display",serif;color:#9A6B12;margin-top:6px}
#wk{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:18px 0}
@media(max-width:560px){#wk{grid-template-columns:repeat(6,1fr)}}
#wk button{position:relative;border:0;padding:12px 0;font:italic 600 1.2rem "Playfair Display",serif;color:var(--ink);cursor:pointer}
#wk button.s::after{content:"";position:absolute;left:50%;bottom:5px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--ink)}
#wk button[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px}
.b0{background:var(--sky)}.b1{background:var(--champ)}.b2{background:var(--peach)}.b3{background:#CFE7F6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips span,.chip span{display:block;border:1px solid var(--gold);padding:4px 14px;border-radius:999px;font-size:.92rem;background:#fff}
.bio{list-style:none;padding:0;margin:14px 0}.bio li{padding:6px 0 6px 22px;position:relative}.bio li::before{content:"";position:absolute;left:0;top:16px;width:10px;border-top:2px solid var(--gold)}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
@media(max-width:760px){.gal{grid-template-columns:repeat(2,1fr)}}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.gal figure{margin:0}.gal figure:nth-child(2n){margin-top:22px}
.gal figcaption{font:italic 500 1.05rem "Playfair Display",serif;padding-top:6px}
.chip{position:relative;cursor:pointer}.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip input:checked+span{background:var(--gold);border-color:var(--gold);font-weight:800}
.chip input:disabled+span{text-decoration:line-through;opacity:.45}.chip input:disabled{cursor:not-allowed}
.chip input:focus-visible+span{outline:3px solid #9A6B12;outline-offset:2px}
.fl{margin:14px 0}.fl>b{display:block;margin-bottom:6px}
input[type=text]{width:100%;max-width:360px;font:inherit;color:var(--ink);padding:9px 14px;border:1px solid var(--gold);background:#fff;border-radius:2px}
.faq{columns:2;column-gap:36px;margin-top:14px}
@media(max-width:760px){.faq{columns:1}}
.q{break-inside:avoid;border-top:1px solid var(--gold)}
.q button{width:100%;text-align:left;background:transparent;border:0;padding:14px 28px 14px 0;font:600 1.15rem "Playfair Display",serif;color:var(--ink);cursor:pointer;position:relative}
.q button::after{content:"+";position:absolute;right:4px;top:12px;color:var(--gold);font-size:1.4rem}
.q button[aria-expanded=true]::after{content:"–"}
.q p{padding-right:10px}
.q p[hidden]{display:none}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--gold);font-weight:800}
</style>
</head>

// rueda
const N=6,CX=220,CY=190,R=125,v=[5,5,5,5,5,5];
const ang=i=>-Math.PI/2+i*2*Math.PI/N,pt=(i,r)=>[CX+r*Math.cos(ang(i)),CY+r*Math.sin(ang(i))];
$('#sls').innerHTML=D.axes.map((a,i)=>`<div class="sl"><label for="s${i}">${a[0]}</label><output id="o${i}">5</output><input type="range" id="s${i}" min="1" max="10" value="5"></div>`).join('');
function draw(){
 let g='';[.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${D.axes.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#D4A33C" stroke-opacity="${f==1?.9:.35}"/>`});
 D.axes.forEach((a,i)=>{const [x,y]=pt(i,R),[lx,ly]=pt(i,R+14),an=Math.abs(lx-CX)<8?'middle':lx<CX?'end':'start';
  g+=`<line x1="${CX}" y1="${CY}" x2="${x}" y2="${y}" stroke="#D4A33C" stroke-opacity=".4"/><text x="${lx}" y="${ly+(ly<CY?-2:12)}" text-anchor="${an}" font-size="14" font-weight="700" fill="#2E3A4F" font-family="Manrope,sans-serif">${a[0]}</text>`});
 const P=v.map((n,i)=>pt(i,R*n/10));
 g+=`<polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="#8EC5E8" fill-opacity=".55" stroke="#2E3A4F" stroke-width="2" stroke-linejoin="round"/>`+P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#D4A33C" stroke="#2E3A4F"/>`).join('');
 $('#rd').innerHTML=g;$('#rd').setAttribute('aria-label',D.axes.map((a,i)=>a[0]+' '+v[i]).join(', '));
 const mn=Math.min(...v),mx=Math.max(...v),lo=v.indexOf(mn),hi=v.indexOf(mx);
 $('#rr').innerHTML=mn===mx?T.bal:`<b>${T.low}:</b> ${D.axes[lo][0]} (${mn})<br><b>${T.high}:</b> ${D.axes[hi][0]} (${mx})<br><b>${T.stp}:</b> ${D.axes[lo][1]}`;
 $('#waw').href='https://wa.me/34600000000?text='+encodeURIComponent(T.wawheel.replace('{s}',D.axes.map((a,i)=>a[0]+' '+v[i]+'/10').join(', ')));}
$('#sls').addEventListener('input',e=>{const i=+e.target.id.slice(1);v[i]=+e.target.value;$('#o'+i).textContent=v[i];draw()});draw();

$$('#steps button').forEach((b,i)=>b.onclick=()=>st(i));st(0);

// Íñigo, galería
$('#bio').innerHTML=D.bio.map(b=>`<li>${b}</li>`).join('');$('#top').innerHTML=D.topics.map(t=>`<span>${t}</span>`).join('');
$('#gal').innerHTML=['sala','sesion','mesa','detalle'].map((k,i)=>`<figure><img src="${IM[k]}" alt="${D.alt[k]}"><figcaption>${D.gal[i]}</figcaption></figure>`).join('');
// reserva
$('#bd').innerHTML=D.days.map((d,i)=>`<label class="chip"><input type="radio" name="d" value="${i}"><span>${d}</span></label>`).join('');
function times(){const d=+(document.querySelector('[name=d]:checked')||{value:-1}).value;
 $('#bt').innerHTML=D.times.map((t,i)=>`<label class="chip"><input type="radio" name="h" value="${i}"${d<0||D.taken[d].includes(i)?' disabled':''}><span>${t}</span></label>`).join('');sum()}
function sum(){const d=document.querySelector('[name=d]:checked'),h=document.querySelector('[name=h]:checked'),w=$('#bw');
 if(!d||!h){$('#bs').textContent=T.rpick;w.removeAttribute('href');w.style.opacity=.4;w.setAttribute('aria-disabled','true');return}
 const dn=D.days[+d.value],hn=D.times[+h.value],n=$('#bn').value.trim();$('#bs').textContent=T.rsum.replace('{d}',dn).replace('{h}',hn);
 w.style.opacity=1;w.removeAttribute('aria-disabled');w.href='https://wa.me/34600000000?text='+encodeURIComponent((n?T.warsv.replace('{n}',n):T.wanon).replace('{d}',dn).replace('{h}',hn))}
$('#bd').addEventListener('change',times);$('#bt').addEventListener('change',sum);$('#bn').addEventListener('input',sum);times();
// preguntas
$('#faq').innerHTML=D.faq.map((f,i)=>`<div class="q"><button aria-expanded="false" aria-controls="q${i}">${f[0]}</button><p id="q${i}" hidden>${f[1]}</p></div>`).join('');
$$('#faq button').forEach(b=>b.onclick=()=>{const a=document.getElementById(b.getAttribute('aria-controls')),o=a.hidden;a.hidden=!o;b.setAttribute('aria-expanded',o)});
</script>
</body>
</html>
