<style>
:root{--ivory:#FBF3E4;--honey:#E3A94B;--coral:#F2A07B;--mist:#BFD7E6;--tea:#9DB59A;--ink:#4A3B32;--c:#F2A07B}
*{box-sizing:border-box}

.tag{display:inline-block;font:600 .95rem "Nunito Sans",sans-serif;background:rgba(251,243,228,.9);border-radius:999px;padding:3px 16px;margin-bottom:12px}
.lead{font-size:1.2rem;max-width:30em}

.btn{display:inline-block;background:var(--ink);color:var(--ivory);border:0;border-radius:999px;padding:11px 26px;font:700 1rem "Nunito Sans",sans-serif;cursor:pointer;text-decoration:none;margin:6px 10px 6px 0}

.btn:disabled{opacity:.4}

.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,44px);align-items:center}
#bwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
#bs{width:min(64vw,260px);aspect-ratio:1;display:grid;place-items:center}
#bc{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#FFE7B8,var(--honey) 55%,var(--coral));transform:scale(.55);display:grid;place-items:center;text-align:center;font:600 1.5rem "Cormorant Garamond",Georgia,serif;box-shadow:0 0 0 14px rgba(227,169,75,.22),0 0 0 32px rgba(242,160,123,.14)}
#bt{min-height:3.2em;text-align:center;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:block;border-radius:999px;padding:6px 16px;background:rgba(191,215,230,.45);box-shadow:inset 0 0 0 2px rgba(74,59,50,.25)}
.chip input:checked+span{background:var(--honey);box-shadow:none;font-weight:700}
.chip input:focus-visible+span{outline:3px solid #B25A33;outline-offset:2px}
.hw{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:760px){.hw{grid-template-columns:1fr}}
.hw p{font:500 1.6rem/1.2 "Cormorant Garamond",Georgia,serif;margin:0;padding:18px 20px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;text-align:center;display:grid;place-items:center;min-height:170px}
.hw p:nth-child(1){background:#F8D8C6}.hw p:nth-child(2){background:#DCE9F1}.hw p:nth-child(3){background:#DDE7D8}
.sv{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:18px 0}
@media(max-width:620px){.sv{grid-template-columns:1fr}}
.sv div{padding:18px 22px;border-radius:26px;background:#fff8ec;box-shadow:inset 0 0 0 2px rgba(74,59,50,.14)}
.sv b{display:block;color:#B25A33;margin-top:6px}
.note{border-radius:22px;background:rgba(191,215,230,.5);padding:12px 18px;font-size:.95rem;margin-top:14px}
.fld{margin:14px 0}.fld>b{display:block;margin-bottom:6px;font-weight:700}
.res{border-radius:28px;background:#fff8ec;padding:20px 24px;box-shadow:inset 0 0 0 2px var(--honey)}
.res h3{margin:4px 0 8px}
#days{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
#days button{border:0;border-radius:999px;padding:6px 16px;background:rgba(191,215,230,.5);color:var(--ink);font:700 .95rem "Nunito Sans",sans-serif;cursor:pointer}
#days button[aria-pressed=true]{background:var(--ink);color:var(--ivory)}
#trk{position:relative;height:84px;margin:12px 14px 4px}
#trk::before{content:"";position:absolute;left:0;right:0;top:22px;border-top:3px dotted rgba(74,59,50,.4)}
.dot{position:absolute;top:8px;width:30px;height:30px;margin-left:-15px;border-radius:50%;border:0;background:var(--coral);cursor:pointer;box-shadow:0 0 0 6px rgba(242,160,123,.3)}
.dot[aria-pressed=true]{background:var(--honey);box-shadow:0 0 0 8px rgba(227,169,75,.4)}
.dot small{position:absolute;top:36px;left:50%;transform:translateX(-50%);font:700 .8rem "Nunito Sans",sans-serif;color:var(--ink);white-space:nowrap}
.tk{position:absolute;top:60px;font-size:.75rem;opacity:.65;transform:translateX(-50%)}
.stones{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px}

.st{width:100%;display:flex;flex-direction:column;align-items:center}
.st:nth-child(1) button{width:100%;background:#F8D8C6}.st:nth-child(2) button{width:92%;background:#DCE9F1}.st:nth-child(3) button{width:84%;background:#DDE7D8}.st:nth-child(4) button{width:92%;background:#F6E2B5}.st:nth-child(5) button{width:100%;background:#F8D8C6}

.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}
.gal figure{margin:0}.gal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}

.gal figcaption{text-align:center;font:500 1.15rem "Cormorant Garamond",Georgia,serif;padding-top:4px}
.foot{margin-top:18px;padding-top:12px;border-top:2px solid rgba(74,59,50,.15);font-weight:700}

const orb=$('#orb'),cap=$('#cap'),secs=$$('main>section');let ci=-1;
function tick(){const max=Math.max(1,document.documentElement.scrollHeight-innerHeight),p=scrollY/max;
 const s=RM?.85:.74+.26*(.5+.5*Math.sin(p*Math.PI*2*7));orb.style.transform=`translate(-50%,-50%) scale(${s})`;
 let k=0;secs.forEach((e,i)=>{const r=e.getBoundingClientRect();if(r.top<=innerHeight*.45)k=i});
 if(k!==ci){ci=k;orb.style.setProperty('--c',secs[k].dataset.c);cap.textContent=D.ph[k]||''}}
addEventListener('scroll',tick,{passive:true});addEventListener('resize',tick);tick();

let pi=1,run=0;
$('#pace').innerHTML=D.pace.map((p,i)=>`<label class="chip"><input type="radio" name="pace" value="${i}"${i==1?' checked':''}><span>${p[0]}</span></label>`).join('');
$('#pace').addEventListener('change',e=>pi=+e.target.value);
const bc=$('#bc'),bt=$('#bt'),go=$('#go');bt.textContent=T.ready;go.textContent=T.start;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function breathe(){const id=++run,pc=D.pace[pi][1];go.textContent=T.stop;
 for(let n=1;n<=4;n++){for(let ph=0;ph<3;ph++){if(id!==run)return;const sec=pc[ph];
  if(!RM){bc.style.transition=ph==1?'none':`transform ${sec}s ease-in-out`;bc.style.transform=`scale(${ph==2?.55:1})`}
  for(let s=sec;s>0;s--){if(id!==run)return;bt.innerHTML=D.phases[ph]+' · '+s+'<br><small>'+T.cyc.replace('{n}',n)+'</small>';bc.textContent=D.phases[ph];await sleep(1000)}}}
 if(id===run){bt.textContent=T.done;bc.textContent='';go.textContent=T.start;if(!RM){bc.style.transition='transform 2s';bc.style.transform='scale(.55)'}}}
go.onclick=()=>{if(go.textContent===T.stop){run++;go.textContent=T.start;bt.textContent=T.ready;bc.textContent='';bc.style.transition='transform 1s';bc.style.transform='scale(.55)'}else breathe()};
